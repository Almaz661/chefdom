name: Download Product Images

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'С какой позиции (0 = начало)'
        default: '0'
        required: false
      to:
        description: 'По какую позицию (пусто = все)'
        default: ''
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp
        run: npm install sharp

      - name: Create directories
        run: |
          mkdir -p public/images/products/vegetables
          mkdir -p public/images/products/fruits
          mkdir -p public/images/products/meat
          mkdir -p public/images/products/fish
          mkdir -p public/images/products/dairy
          mkdir -p public/images/products/grains
          mkdir -p public/images/products/oils
          mkdir -p public/images/products/spices
          mkdir -p public/images/products/beverages
          mkdir -p public/images/products/nuts
          mkdir -p public/images/products/sweets
          mkdir -p public/images/products/frozen
          mkdir -p public/images/products/greens

      - name: Download images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FROM: ${{ inputs.from || '0' }}
          TO: ${{ inputs.to || '' }}
        run: node scripts/download-images.mjs

      - name: Show results
        run: |
          echo "Files downloaded:"
          find public/images/products \( -name "*.webp" -o -name "*.jpg" \) | wc -l
          find public/images/products \( -name "*.webp" -o -name "*.jpg" \) | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/products/
          if git diff --staged --quiet; then
            echo "No new images"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "feat: Product Images — ${COUNT} фото [ci skip]"
            git push origin HEAD:main
            echo "Pushed $COUNT images"
          fi
