name: Download Product Images

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'С какой позиции (0 = начало)'
        default: '0'
        required: false
      to:
        description: 'По какую позицию (пусто = все)'
        default: ''
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp only
        run: npm install sharp

      - name: Create directories
        run: |
          mkdir -p public/images/products/{vegetables,fruits,meat,fish,dairy,grains,oils,spices,beverages,nuts,sweets,frozen,greens}

      - name: Run download script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FROM: ${{ inputs.from || '0' }}
          TO: ${{ inputs.to || '' }}
        run: node --experimental-strip-types scripts/download-product-images.ts

      - name: Show results
        run: |
          echo "Files downloaded:"
          find public/images/products -name "*.webp" -o -name "*.jpg" | wc -l
          find public/images/products \( -name "*.webp" -o -name "*.jpg" \) | head -30

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/products/
          if git diff --staged --quiet; then
            echo "No new images to commit"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "feat: Product Images — ${COUNT} фото продуктов [ci skip]"
            git push origin HEAD:main
            echo "Pushed $COUNT images to main"
          fi
