name: Download Product Images

# Запускается вручную через GitHub → Actions → Run workflow
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Начать с позиции (0 = начало)'
        default: '0'
        required: false
      to:
        description: 'Закончить на позиции (пусто = все)'
        default: ''
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install sharp --save-dev

      - name: Create product image directories
        run: |
          mkdir -p public/images/products/vegetables
          mkdir -p public/images/products/fruits
          mkdir -p public/images/products/meat
          mkdir -p public/images/products/fish
          mkdir -p public/images/products/dairy
          mkdir -p public/images/products/grains
          mkdir -p public/images/products/oils
          mkdir -p public/images/products/spices
          mkdir -p public/images/products/beverages
          mkdir -p public/images/products/nuts
          mkdir -p public/images/products/sweets
          mkdir -p public/images/products/frozen
          mkdir -p public/images/products/greens

      - name: Download product images from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FROM: ${{ github.event.inputs.from || '0' }}
          TO: ${{ github.event.inputs.to || '' }}
        run: |
          npx tsx scripts/download-product-images.ts

      - name: Show downloaded files
        run: |
          echo "=== Downloaded files ==="
          find public/images/products -name "*.webp" | wc -l
          find public/images/products -name "*.webp" | head -20

      - name: Commit and push images
        run: |
          git config user.name "kiro-agent[bot]"
          git config user.email "kiro-agent[bot]@users.noreply.github.com"
          git add public/images/products/
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Нет новых файлов для коммита"
          else
            COUNT=$(git diff --staged --name-only | wc -l)
            git commit -m "feat: добавлено $COUNT фото продуктов (Product Image Library)"
            git push origin feat/product-images-ci
            echo "✅ Запушено $COUNT новых фото"
          fi
